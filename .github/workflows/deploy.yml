name: Deploy VuelaData Backend & Workers to AWS ECS

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: vueladata/backend-workers
  ECS_CLUSTER: vueladata-cluster

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run Tests
        env:
          DATABASE_URL: sqlite:///./test.db
        run: |
          pytest tests/test_schemas.py tests/workers -v

  build-and-deploy:
    name: Build, Push to ECR & Deploy to ECS
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Compilando imagen linux/amd64 para ECR: $ECR_REGISTRY/$ECR_REPOSITORY..."
          docker build --platform linux/amd64 \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          
          echo "Subiendo imagen con tag SHA y latest..."
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy to Amazon ECS (Zero Downtime Rolling Update)
        run: |
          echo "Actualizando servicios en el clúster $ECS_CLUSTER..."
          SERVICES=("vueladata-fastapi-backend-service" "vueladata-worker-rds-service" "vueladata-worker-lake-service" "vueladata-worker-notificaciones-service")
          
          for SERVICE in "${SERVICES[@]}"; do
            STATUS=$(aws ecs describe-services --cluster $ECS_CLUSTER --services $SERVICE --query 'services[0].status' --output text 2>/dev/null || echo "MISSING")
            if [ "$STATUS" == "ACTIVE" ]; then
              echo ">>> Actualizando servicio en caliente: $SERVICE"
              aws ecs update-service --cluster $ECS_CLUSTER --service $SERVICE --force-new-deployment
            else
              echo ">>> Aviso: Servicio $SERVICE no está activo en ECS (estado: $STATUS), omitiendo actualización automática."
            fi
          done
          echo "Proceso de despliegue completado con éxito."
